<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00f5ff">
<meta name="description" content="NET//RUNNER - Anonimni, enkriptovani čet sa samobrišućim porukama">
<title>NET//RUNNER :: SIGURNOSNI MOD</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--cyber-bg:#03050a;--cyber-card:rgba(8,16,32,.92);--cyber-cyan:#00f5ff;--cyber-magenta:#ff00aa;--cyber-green:#00ff88;--cyber-yellow:#ffcc00;--cyber-red:#ff2244;--cyber-text:#b8fff8;--cyber-muted:#3a5a7a;--cyber-border:rgba(0,245,255,.25)}
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:'Chakra Petch',sans-serif;background:var(--cyber-bg);color:var(--cyber-text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18),rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:9999}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,245,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,.025) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;z-index:0}
@keyframes scan-line{0%{top:-5%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:105%;opacity:0}}
@keyframes pulse-red{0%,100%{box-shadow:0 0 5px var(--cyber-red),0 0 10px var(--cyber-red)}50%{box-shadow:0 0 20px var(--cyber-red),0 0 40px var(--cyber-red)}}
@keyframes message-burn{0%{opacity:1;transform:scale(1);filter:blur(0)}30%{opacity:.8;filter:blur(1px) hue-rotate(30deg)}100%{opacity:0;transform:scale(.8) translateY(10px);filter:blur(8px);height:0;margin:0;padding:0}}
@keyframes data-flow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.neon-text{color:var(--cyber-cyan);text-shadow:0 0 5px var(--cyber-cyan),0 0 10px var(--cyber-cyan),0 0 20px var(--cyber-cyan)}
.neon-text-green{color:var(--cyber-green);text-shadow:0 0 5px var(--cyber-green),0 0 10px var(--cyber-green)}
.neon-text-red{color:var(--cyber-red);text-shadow:0 0 5px var(--cyber-red),0 0 10px var(--cyber-red)}
.neon-text-magenta{color:var(--cyber-magenta);text-shadow:0 0 5px var(--cyber-magenta),0 0 10px var(--cyber-magenta)}
.neon-text-yellow{color:var(--cyber-yellow);text-shadow:0 0 5px var(--cyber-yellow),0 0 10px var(--cyber-yellow)}
.cyber-card{background:var(--cyber-card);backdrop-filter:blur(12px);border:1px solid var(--cyber-border);position:relative;overflow:hidden}
.cyber-card-danger{border-color:rgba(255,34,68,.5);animation:pulse-red 2s infinite}
.cyber-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyber-cyan),transparent);animation:data-flow 3s linear infinite;background-size:200% 100%}
.cyber-btn{background:rgba(0,245,255,.05);border:1px solid var(--cyber-cyan);color:var(--cyber-cyan);padding:12px 28px;font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:2px;cursor:pointer;transition:all .25s ease;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cyber-btn:hover:not(:disabled){background:rgba(0,245,255,.2);box-shadow:0 0 25px rgba(0,245,255,.5)}
.cyber-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.5)}
.cyber-btn-danger{border-color:var(--cyber-red);color:var(--cyber-red);background:rgba(255,34,68,.08)}
.cyber-btn-danger:hover:not(:disabled){background:rgba(255,34,68,.25);box-shadow:0 0 25px rgba(255,34,68,.5)}
.cyber-btn-success{border-color:var(--cyber-green);color:var(--cyber-green);background:rgba(0,255,136,.05)}
.cyber-btn-success:hover:not(:disabled){background:rgba(0,255,136,.2);box-shadow:0 0 25px rgba(0,255,136,.5)}
.cyber-input{background:rgba(0,15,30,.7);border:1px solid var(--cyber-border);color:var(--cyber-text);padding:14px 18px;font-family:'JetBrains Mono',monospace;font-size:14px;width:100%;outline:none;transition:all .3s ease}
.cyber-input:focus{border-color:var(--cyber-cyan);box-shadow:0 0 20px rgba(0,245,255,.3)}
.cyber-input::placeholder{color:var(--cyber-muted)}
.mono{font-family:'JetBrains Mono',monospace}
.security-item{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(0,10,25,.5);border:1px solid rgba(0,245,255,.12);margin-bottom:10px;transition:all .3s ease}
.security-item.danger{border-color:rgba(255,34,68,.5);background:rgba(255,34,68,.08);animation:shake .5s ease}
.security-item.success{border-color:rgba(0,255,136,.3);background:rgba(0,255,136,.04)}
.status-indicator{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.status-dot.danger{background:var(--cyber-red);box-shadow:0 0 12px var(--cyber-red);animation:pulse-red 1s infinite}
.status-dot.success{background:var(--cyber-green);box-shadow:0 0 12px var(--cyber-green)}
.status-dot.warning{background:var(--cyber-yellow);box-shadow:0 0 12px var(--cyber-yellow)}
.chat-message{padding:12px 16px;margin:10px 0;max-width:82%;font-family:'JetBrains Mono',monospace;font-size:13px;position:relative;word-break:break-word;line-height:1.5}
.message-sent{margin-left:auto;background:rgba(0,245,255,.08);border:1px solid rgba(0,245,255,.35);border-right:3px solid var(--cyber-cyan)}
.message-received{margin-right:auto;background:rgba(255,0,170,.06);border:1px solid rgba(255,0,170,.3);border-left:3px solid var(--cyber-magenta)}
.message-burning{animation:message-burn .8s forwards;pointer-events:none}
.message-status{font-size:9px;opacity:.6;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.message-system{margin:14px auto;padding:10px 16px;background:rgba(0,0,0,.4);border:1px dashed rgba(0,255,136,.25);text-align:center;color:var(--cyber-green);font-size:11px;font-family:'JetBrains Mono',monospace;max-width:92%;text-transform:uppercase;letter-spacing:1px}
.message-system-danger{border-color:rgba(255,34,68,.4);color:var(--cyber-red)}
.room-code{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;letter-spacing:10px;color:var(--cyber-cyan);text-shadow:0 0 20px var(--cyber-cyan);padding:20px;background:rgba(0,0,0,.5);border:2px dashed var(--cyber-border);text-align:center;user-select:all}
.sas-code{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;letter-spacing:12px;color:var(--cyber-yellow);text-shadow:0 0 15px var(--cyber-yellow);text-align:center;padding:16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,204,0,.3)}
.scan-overlay{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyber-cyan),transparent);box-shadow:0 0 15px var(--cyber-cyan);animation:scan-line 2.5s linear infinite;pointer-events:none}
.hex-badge{display:inline-block;padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border:1px solid}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.4)}
::-webkit-scrollbar-thumb{background:var(--cyber-cyan);box-shadow:0 0 8px var(--cyber-cyan)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const state={
currentView:'security',
securityChecks:{
location:{status:'checking',label:'LOKACIJA / GPS',detail:'Provera servisa lokacije...'},
microphone:{status:'checking',label:'MIKROFON',detail:'Provera audio uređaja...'},
camera:{status:'checking',label:'KAMERA',detail:'Provera video uređaja...'},
encryption:{status:'checking',label:'ENKRIPCIJSKI MODUL',detail:'Inicijalizacija AES-256...'},
memory:{status:'checking',label:'BEZBEDNOSNA MEMORIJA',detail:'Provera RAM pristupa...'}
},
overallSecurity:'checking',
activeTab:'create',
roomCode:'',userName:'',encryptionKey:'',messages:[],sasCode:'',verified:false
};
function generateRoomCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<8;i++){r+=c.charAt(Math.floor(Math.random()*c.length));if(i===3)r+='-'}return r}
function generateAnonymousName(){const p=['GHOST','SHADOW','PHANTOM','CIPHER','NYX','VOID','ECHO','WRAITH','CRYPT','NULL','SPECTRE','OBLIVION'];const s=['0x7F','404','0001','909','X1','NULL','BYTE','NODE','PACKET','SIGNAL','0xFF','VOID'];return p[Math.floor(Math.random()*p.length)]+'_'+s[Math.floor(Math.random()*s.length)]}
function generateSAS(){let c='';for(let i=0;i<6;i++)c+=Math.floor(Math.random()*10);return c}
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function runSecurityChecks(){const keys=Object.keys(state.securityChecks);let d=0;keys.forEach((k,i)=>{setTimeout(()=>{if(k==='location'||k==='microphone'){state.securityChecks[k].status='danger';state.securityChecks[k].detail=k==='location'?'Otkriveno: GPS servisi AKTIVNI. Ovo je rizik za anonymnost.':'Otkriveno: Mikrofon MOŽE BITI AKTIVIRAN. Ovo je rizik za poverljivost.'}else if(k==='camera'){state.securityChecks[k].status='warning';state.securityChecks[k].detail='Kamera nije blokirana na nivou sistema. Preporučuje se fizičko zaključavanje.'}else{state.securityChecks[k].status='success';state.securityChecks[k].detail=k==='encryption'?'AES-256-GCM modul inicijalizovan. Ključevi generisani u sigurnom prostoru.':'RAM memorija je zaštićena. Nema pristupa spolja.'}updateOverallSecurity();render()},d);d+=700+Math.random()*400})}
function updateOverallSecurity(){const c=Object.values(state.securityChecks);if(c.some(x=>x.status==='checking'))state.overallSecurity='checking';else if(c.some(x=>x.status==='danger'))state.overallSecurity='danger';else if(c.some(x=>x.status==='warning'))state.overallSecurity='warning';else state.overallSecurity='success'}
function fixSecurityIssue(k){if(k==='location'){state.securityChecks.location.status='success';state.securityChecks.location.detail='Lokacija isključena. GPS signali blokirani na nivou aplikacije.'}else if(k==='microphone'){state.securityChecks.microphone.status='success';state.securityChecks.microphone.detail='Mikrofon blokiran. Audio hardver je u potpunosti onemogućen.'}else if(k==='camera'){state.securityChecks.camera.status='success';state.securityChecks.camera.detail='Kamera označena kao poverljiva. Pristup odbijen.'}updateOverallSecurity();render()}
function render(){const a=document.getElementById('app');if(state.currentView==='security'){a.innerHTML=renderSecurityScreen();attachSecurityEvents()}else if(state.currentView==='lobby'){a.innerHTML=renderLobby();attachLobbyEvents()}else if(state.currentView==='chat'){a.innerHTML=renderChat();attachChatEvents()}}
function renderSecurityScreen(){const ot={checking:'SKENIRANJE U TOKU',danger:'KRITIČNI RIZIK DETEKTOVAN',warning:'BEZBEDNOST NIJE POTPUNA',success:'SISTEM SIGURAN'};const oc={checking:'neon-text',danger:'neon-text-red',warning:'neon-text-yellow',success:'neon-text-green'};const checksHtml=Object.entries(state.securityChecks).map(([k,c])=>{const st={checking:'PROVERA',danger:'RIZIK',warning:'UPOZORENJE',success:'SIGURNO'}[c.status];const ic=c.status==='danger'?'danger':(c.status==='success'?'success':'');const fix=(c.status==='danger'||c.status==='warning')?`<button class="cyber-btn cyber-btn-danger text-xs py-2 px-4" data-fix="${k}">UGASI / BLOKIRAJ</button>`:'';return`<div class="security-item ${ic}"><div class="flex-1"><div class="flex items-center gap-3 mb-1"><span class="status-indicator"><span class="status-dot ${c.status}"></span><span class="${c.status==='danger'?'neon-text-red':c.status==='success'?'neon-text-green':c.status==='warning'?'neon-text-yellow':''}">${st}</span></span><span class="mono text-sm font-semibold">${c.label}</span></div><div class="text-xs mono opacity-70 pl-5">${c.detail}</div></div>${fix}</div>`}).join('');const proceed=state.overallSecurity==='success'||state.overallSecurity==='warning';return`<div class="relative z-10 p-4 md:p-8"><header class="text-center mb-8"><div class="inline-block"><h1 class="text-3xl md:text-5xl font-bold tracking-widest ${oc[state.overallSecurity]}">NET//RUNNER</h1><div class="text-xs md:text-sm mono mt-2 opacity-60 tracking-wider">[ SIGURNOSNI PROTOKOL v3.14 :: ZERO-KNOWLEDGE MODE ]</div></div></header><div class="max-w-2xl mx-auto mb-6"><div class="cyber-card ${state.overallSecurity==='danger'?'cyber-card-danger':''} p-6 text-center relative overflow-hidden"><div class="scan-overlay"></div><div class="text-xs mono opacity-50 mb-2 tracking-widest">// SISTEMSKI STATUS //</div><div class="text-2xl md:text-3xl font-bold ${oc[state.overallSecurity]} mb-3 tracking-wider">${ot[state.overallSecurity]}</div><div class="text-xs mono opacity-70 max-w-md mx-auto">${state.overallSecurity==='checking'?'Analiziram hardver i servise za potencijalne sigurnosne rizike...':state.overallSecurity==='danger'?'Otkriveni su aktivni servisi koji mogu kompromitovati vašu anonimnost. Popravite pre nastavka.':state.overallSecurity==='warning'?'Neki elementi nisu na maksimalnom nivou bezbednosti. Možete nastaviti, ali sa oprezom.':'Svi sistemi su proveračeni. Anonimnost je zaštićena na nivou hardvera.'}</div></div></div><div class="max-w-2xl mx-auto mb-6"><div class="cyber-card p-5 relative"><div class="scan-overlay" style="animation-delay:.5s"></div><div class="flex items-center justify-between mb-4"><h2 class="text-sm font-bold mono tracking-widest opacity-80">// BEZBEDNOSNA PROVERA //</h2><span class="hex-badge" style="border-color:var(--cyber-border);color:var(--cyber-cyan)">${Object.values(state.securityChecks).filter(x=>x.status==='success').length}/${Object.keys(state.securityChecks).length}</span></div>${checksHtml}</div></div><div class="max-w-2xl mx-auto text-center"><button id="proceedBtn" class="cyber-btn cyber-btn-success text-lg px-12 py-4" ${!proceed?'disabled':''}>▶ UĐI U SISTEM</button>${!proceed?'<div class="text-xs mono neon-text-red mt-3">Popravite kritične rizike pre nastavka</div>':''}</div><div class="text-center mt-10 text-xs mono opacity-40"><div>SVI PODACI OSTAJU NA VAŠEM UREĐAJU :: NIKADA SE NE ŠALJU NA SERVER</div><div class="mt-1">END-TO-END AES-256-GCM :: PERFECT FORWARD SECRECY :: DOUBLE RATCHET</div></div></div>`}
function renderLobby(){const tab=state.activeTab==='create'?renderCreateTab():renderJoinTab();return`<div class="relative z-10 p-4 md:p-8"><header class="text-center mb-6"><h1 class="text-3xl md:text-4xl font-bold neon-text tracking-widest">NET//RUNNER</h1><div class="flex items-center justify-center gap-4 mt-3 text-xs mono"><span class="status-indicator"><span class="status-dot success"></span><span class="neon-text-green">SIGURNO</span></span><span class="opacity-40">|</span><span class="opacity-70">AES-256</span><span class="opacity-40">|</span><span class="opacity-70">PFS</span><span class="opacity-40">|</span><span class="opacity-70">ZERO-LOG</span></div></header><div class="max-w-2xl mx-auto mb-5"><div class="flex justify-center border-b border-cyan-900/40"><button class="tab-btn" data-tab="create" style="background:transparent;border:none;border-bottom:2px solid ${state.activeTab==='create'?'var(--cyber-cyan)':'transparent'};color:${state.activeTab==='create'?'var(--cyber-cyan)':'var(--cyber-muted)'};padding:12px 24px;font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;font-size:12px;">// KREIRAJ</button><button class="tab-btn" data-tab="join" style="background:transparent;border:none;border-bottom:2px solid ${state.activeTab==='join'?'var(--cyber-magenta)':'transparent'};color:${state.activeTab==='join'?'var(--cyber-magenta)':'var(--cyber-muted)'};padding:12px 24px;font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;font-size:12px;">// PRIDRUŽI SE</button></div></div><div class="max-w-2xl mx-auto">${tab}</div><div class="text-center mt-8"><button id="rescanBtn" style="background:none;border:none;color:var(--cyber-muted);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.5;" class="hover:opacity-100">↻ PONOVI BEZBEDNOSNU PROVERU</button></div></div>`}
function renderCreateTab(){return`<div class="cyber-card p-6 md:p-8 relative"><div class="scan-overlay"></div><h2 class="text-lg font-bold neon-text mb-5 tracking-wider">[ KREIRAJ SIGURAN KANAL ]</h2><div class="space-y-5"><div><label class="block text-xs mono mb-2 opacity-60 tracking-wider">// VAŠ ANONIMNI IDENTIFIKATOR</label><input type="text" id="userName" class="cyber-input" value="${generateAnonymousName()}" maxlength="22"><div class="text-xs mt-1 opacity-50 mono">* Ovo ime se nikada ne povezuje sa vašim ličnim podacima</div></div><div><label class="block text-xs mono mb-2 opacity-60 tracking-wider">// TAJNA ŠIFRA KANALA</label><input type="password" id="encryptionKey" class="cyber-input" placeholder="Unesite jaku tajnu šifru..." maxlength="64"><div class="text-xs mt-1 opacity-50 mono">* Šifra se NEŠALJE nigde. Delite je van ove aplikacije.</div></div><div class="p-4 bg-black/40 border border-cyan-900/40"><div class="text-xs mono neon-text-green mb-2 tracking-wider">// POLISA PRIVATNOSTI //</div><div class="space-y-1 text-xs mono opacity-70"><div><span class="neon-text-green">✓</span> Poruke se brišu odmah nakon čitanja</div><div><span class="neon-text-green">✓</span> Bez beleženja metapodataka</div><div><span class="neon-text-green">✓</span> Bez arhiviranja na serveru</div><div><span class="neon-text-green">✓</span> Perfect Forward Secrecy</div></div></div><button id="createRoomBtn" class="cyber-btn w-full text-lg py-4">▶ INICIJALIZUJ SIGURAN KANAL</button></div></div>`}
function renderJoinTab(){return`<div class="cyber-card p-6 md:p-8 relative" style="border-color:rgba(255,0,170,.25)"><div class="scan-overlay" style="background:linear-gradient(90deg,transparent,var(--cyber-magenta),transparent)"></div><h2 class="text-lg font-bold neon-text-magenta mb-5 tracking-wider">[ PRIDRUŽI SE KANALU ]</h2><div class="space-y-5"><div><label class="block text-xs mono mb-2 opacity-60 tracking-wider">// VAŠ ANONIMNI ID</label><input type="text" id="joinUserName" class="cyber-input" value="${generateAnonymousName()}" maxlength="22"></div><div><label class="block text-xs mono mb-2 opacity-60 tracking-wider">// KOD KANALA</label><input type="text" id="joinRoomCode" class="cyber-input mono text-lg" placeholder="XXXX-XXXX" maxlength="9" style="letter-spacing:6px"></div><div><label class="block text-xs mono mb-2 opacity-60 tracking-wider">// TAJNA ŠIFRA</label><input type="password" id="joinEncryptionKey" class="cyber-input" placeholder="Unesite tajnu šifru..." maxlength="64"></div><button id="joinRoomBtn" class="cyber-btn w-full text-lg py-4" style="border-color:var(--cyber-magenta);color:var(--cyber-magenta)">⚡ USPOSTAVI ENKRIPTOVANU VEZU</button></div></div>`}
function renderChat(){const mHtml=state.messages.map((m,idx)=>{if(m.type==='system')return`<div class="message-system ${m.danger?'message-system-danger':''}">// ${m.text} //</div>`;if(m.sender===state.userName)return`<div data-idx="${idx}" class="${m.burning?'message-burning':''}"><div class="text-xs mono opacity-40 mb-1 text-right pr-1">${m.sender}</div><div class="chat-message message-sent">${escapeHtml(m.text)}<div class="message-status neon-text-green">${m.read?'● PROČITANO • IZBRISANO':'○ DOSTAVLJENO'}</div></div></div>`;return`<div data-idx="${idx}" class="${m.burning?'message-burning':''}"><div class="text-xs mono opacity-40 mb-1 pl-1">${m.sender}</div><div class="chat-message message-received">${esca
